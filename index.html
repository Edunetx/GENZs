<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBATA VTU Services</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="container-fluid">
    <ul>
      <li><strong>OBATA VTU</strong></li>
    </ul>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#" role="button">Login</a></li>
    </ul>
  </nav>

  <!-- Main -->
  <main class="container">
    <div class="grid">
      <section>
        <hgroup>
          <h2>Buy Airtime Instantly</h2>
          <h3>Fast, reliable, and secure</h3>
        </hgroup>
        <p>Use the form below to top up any Nigerian number instantly.</p>

        <!-- Airtime Form -->
        <form onsubmit="buyAirtime(event)">
          <label for="network">Select Network</label>
          <select id="network" required>
            <option value="mtn">MTN</option>
            <option value="glo">GLO</option>
            <option value="airtel">Airtel</option>
            <option value="9mobile">9mobile</option>
          </select>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="08012345678" required>

          <label for="amount">Amount (₦)</label>
          <input type="number" id="amount" min="50" step="50" required>

          <button type="submit">Buy Airtime</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="container">
    <small><a href="#">OBATA</a> • <a href="#">Powered by Zendek</a></small>
  </footer>

  <!-- Script -->
  <script>
    async function buyAirtime(event) {
      event.preventDefault();

      const phone = document.getElementById("phone").value;
      const amount = document.getElementById("amount").value;
      const network = document.getElementById("network").value;

      const productCodes = {
        mtn: "mtn_custom",
        glo: "glo_custom",
        airtel: "airtel_custom",
        "9mobile": "9mobile_custom"
      };

      const payload = {
        amount: amount,
        product_code: productCodes[network],
        phone_number: phone,
        action: "vend",
        user_reference: "OBATA_" + Date.now(),
        bypass_network: "yes"
      };

      try {
        const response = await fetch("/.netlify/functions/airtime", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        console.log("API Response:", data);

        if (data.status) {
          alert("✅ Airtime purchase successful: " + data.server_message);
        } else {
          alert("❌ Failed: " + data.server_message);
        }
      } catch (error) {
        console.error("Error:", error);
        alert("⚠️ Error connecting to Airtime Service");
      }
    }
  </script>
</body>
</html>
